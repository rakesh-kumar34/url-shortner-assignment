name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: url_shortener_test
          POSTGRES_USER: url_shortener
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U url_shortener -d url_shortener_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify H2 demo and integration suite
        run: ./mvnw -B verify
      - name: Audit resolved runtime dependencies
        run: |
          ./mvnw -B dependency:tree -DoutputFile=target/dependencies.txt
          python3 tools/audit_dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-test-reports-and-coverage
          path: |
            target/surefire-reports
            target/site/jacoco
      - name: Verify PostgreSQL behavior
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/url_shortener_test
          TEST_DATABASE_USER: url_shortener
          TEST_DATABASE_PASSWORD: ci-ephemeral-password
        run: ./mvnw -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-test-reports
          path: target/surefire-reports
  browser-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_TOKEN: ci-only-browser-token-at-least-32-characters
      DATABASE_PASSWORD: ci-only-database-password
      BASE_URL: http://localhost:8080
      PUBLIC_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install -r tools/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Build and run Docker Compose
        run: |
          docker compose up --build -d
          python - <<'PY'
          import time, urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://localhost:8080/actuator/health/readiness', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Application did not become ready')
          PY
      - name: Verify HTTP behavior on Docker and PostgreSQL
        run: python tools/smoke.py
      - name: Verify desktop and mobile browser flows
        env:
          EMIT_REVIEW_SCREENSHOTS: '1'
        run: python tools/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-evidence
          path: target/browser-smoke
      - name: Stop disposable test stack
        if: always()
        run: docker compose down --volumes
