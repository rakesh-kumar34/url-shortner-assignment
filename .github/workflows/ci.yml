name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shortline_test
          POSTGRES_USER: shortline
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortline -d shortline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify H2 demo and integration suite
        run: ./mvnw -B verify
      - name: Audit resolved runtime dependencies
        run: |
          ./mvnw -B dependency:tree -DoutputFile=target/dependencies.txt
          python3 tools/audit_dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-test-reports-and-coverage
          path: |
            target/surefire-reports
            target/site/jacoco
      - name: Verify PostgreSQL behavior
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/shortline_test
          TEST_DATABASE_USER: shortline
          TEST_DATABASE_PASSWORD: ci-ephemeral-password
        run: ./mvnw -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-test-reports
          path: target/surefire-reports
