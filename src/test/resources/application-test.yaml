spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:h2:mem:url_shortener;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000}
    username: ${TEST_DATABASE_USER:sa}
    password: ${TEST_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
app:
  api-token: test-only-token-with-at-least-32-characters
  public-origin: https://sho.rt
  management-limit: 10000
  redirect-limit: 10000
logging:
  level:
    root: WARN
